<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Persia 1989" />
    <meta
      name="description"
      content="A browser tribute to the 1989 Prince of Persia: its dungeon with depth and torchlight, rotoscope-style movement, and touch controls for phones."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
    <title>Prince of Persia 1989 Tribute</title>
  </head>
  <body>
    <div id="app">
      <canvas id="screen" width="320" height="200" aria-label="Game screen"></canvas>
    </div>

    <div id="controls" aria-hidden="true">
      <div id="dpad">
        <span class="arrow up"></span>
        <span class="arrow down"></span>
        <span class="arrow left"></span>
        <span class="arrow right"></span>
      </div>
      <div id="buttons">
        <button id="btn-jump" class="btn" type="button">JUMP</button>
        <button id="btn-action" class="btn" type="button">ACTION</button>
      </div>
      <div id="sys">
        <button id="btn-pause" type="button" title="Pause">&#10074;&#10074;</button>
        <button id="btn-sound" type="button" title="Sound">&#9834;</button>
        <button id="btn-full" type="button" title="Full screen">&#9974;</button>
      </div>
    </div>
    <p id="hint">Turn your phone sideways for a bigger view</p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
